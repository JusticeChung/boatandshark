<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>辯論生存戰：鯊魚的追擊</title>
    <style>
        body {
            background-color: #001220;
            background-image: linear-gradient(to bottom, #001220, #004d7a);
            color: #e0f7fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box;
        }
        #game-container {
            width: 100%; max-width: 850px;
            background: rgba(0, 20, 40, 0.85);
            border: 2px solid #ff4d4d; border-radius: 15px; padding: 30px;
            box-shadow: 0 0 25px rgba(255, 77, 77, 0.4); text-align: center; position: relative;
        }
        h1 { color: #ff4d4d; text-shadow: 0 0 10px rgba(255, 77, 77, 0.6); margin-top: 0; }
        
        .header-tools { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .edit-btn { background-color: transparent; border: 1px solid #80deea; color: #80deea; padding: 5px 10px; border-radius: 5px; cursor: pointer; }
        .edit-btn:hover { background-color: #80deea; color: #001f3f; }

        /* 軌道與狀態列 */
        #status-bar {
            background: rgba(0, 0, 0, 0.5); padding: 10px; border-radius: 10px; margin-bottom: 15px;
            display: flex; justify-content: space-between; font-weight: bold; color: #ffcc00;
        }
        #track-container {
            font-size: 2em; letter-spacing: 2px; margin-bottom: 20px;
            background: rgba(0,0,0,0.4); padding: 15px; border-radius: 30px; border: 1px solid #ff4d4d;
            overflow: hidden; white-space: nowrap;
        }
        
        /* 鯊魚手段按鈕 */
        #shark-abilities { display: flex; justify-content: center; margin-bottom: 20px; gap: 15px; }
        .ability-btn {
            background-color: #4a0000; color: #ff9999; border: 2px solid #ff4d4d;
            border-radius: 10px; padding: 12px 20px; cursor: pointer; font-weight: bold; flex-grow: 1;
            transition: all 0.2s; font-size: 1.05em;
        }
        .ability-btn:hover:not(:disabled) { background-color: #ff4d4d; color: #fff; }
        .ability-btn:disabled { opacity: 0.4; cursor: not-allowed; border-color: #555; background-color: #222; color: #777;}
        .ability-btn.active { background-color: #ffcc00; color: #000; border-color: #ffcc00; box-shadow: 0 0 15px #ffcc00; }
        .ability-btn.danger { background-color: #800000; color: #fff; animation: pulse 2s infinite; }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 77, 77, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(255, 77, 77, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 77, 77, 0); }
        }

        #action-msg { color: #ffcc00; font-weight: bold; min-height: 28px; margin-bottom: 15px; font-size: 1.15em; }

        /* 題目與選項 */
        #question-box {
            background-color: rgba(0, 40, 70, 0.7); border: 2px solid #80deea; border-radius: 10px;
            padding: 25px; font-size: 1.3em; margin-bottom: 25px; min-height: 80px;
            display: flex; align-items: center; justify-content: center; line-height: 1.5; font-weight: bold;
        }
        #options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        @media (max-width: 600px) { #options-grid { grid-template-columns: 1fr; } }
        
        /* 選項樣式優化，強調等長字數的排版 */
        .option-btn {
            background-color: rgba(0, 20, 40, 0.8); color: #fff; border: 1px solid #4dd0e1;
            border-radius: 10px; padding: 18px 20px; font-size: 1.15em; cursor: pointer;
            transition: all 0.3s ease; text-align: left; line-height: 1.4;
        }
        .option-btn:hover:not(:disabled) { background-color: #005c97; border-color: #00e5ff; }
        .option-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .option-btn.correct { background-color: #00c853 !important; border-color: #00e5ff !important; box-shadow: 0 0 15px #00c853; opacity: 1; }
        .option-btn.wrong { background-color: #d50000 !important; border-color: #ff1744 !important; box-shadow: 0 0 15px #d50000; opacity: 0.8; text-decoration: line-through; }

        /* 彈窗樣式 */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 10, 20, 0.95); z-index: 10;
            flex-direction: column; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box;
        }
        .modal-content {
            background: #001a33; border: 2px solid #ff4d4d; border-radius: 15px; padding: 30px;
            max-width: 650px; width: 100%; text-align: center; box-shadow: 0 0 30px rgba(255, 77, 77, 0.3);
        }
        .exp-title { font-size: 1.7em; margin-bottom: 15px; font-weight: bold; }
        .exp-text { font-size: 1.15em; line-height: 1.6; margin-bottom: 25px; text-align: left; color: #b2ebf2; }
        .next-btn { background-color: #ff4d4d; color: #fff; border: none; border-radius: 10px; padding: 12px 30px; font-size: 1.2em; cursor: pointer; font-weight: bold; }
        .next-btn:hover { background-color: #ff6666; }

        #editor-modal .modal-content { max-width: 800px; height: 80vh; display: flex; flex-direction: column; border-color:#00e5ff;}
        #json-editor { width: 100%; flex-grow: 1; background: #001f3f; color: #00e5ff; border: 1px solid #00e5ff; padding: 10px; font-family: monospace; font-size: 14px; margin-bottom: 15px; resize: none; }
        .editor-btns { display: flex; justify-content: space-between; }
    </style>
</head>
<body>

    <div id="game-container">
        <div class="header-tools">
            <button class="edit-btn" onclick="openEditor()">⚙️ 編輯題目</button>
            <div style="font-weight: bold; color: #b2ebf2; font-size: 1.2em;" id="q-counter">第 1 題 / 共 20 題</div>
        </div>

        <h1>🦈 鯊魚的追擊：實戰深海 ⛵</h1>
        
        <div id="status-bar">
            <span id="distance-text">距離被吃掉: 5 格</span>
            <span id="wrong-text">錯誤次數: 0 / 5</span>
        </div>
        
        <div id="track-container">🦈🌊🌊🌊🌊⛵</div>

        <div id="shark-abilities">
            <button id="btn-dash" class="ability-btn" onclick="toggleDash()">🩸 鯊魚手段：猛衝 (主動)</button>
            <button id="btn-phase2" class="ability-btn" disabled>🌊 深海區：第二階段 (被動)</button>
        </div>

        <div id="action-msg"></div>

        <div id="question-box">載入題目中...</div>
        
        <div id="options-grid">
            <button class="option-btn" onclick="checkAnswer(0)" id="opt-0"></button>
            <button class="option-btn" onclick="checkAnswer(1)" id="opt-1"></button>
            <button class="option-btn" onclick="checkAnswer(2)" id="opt-2"></button>
            <button class="option-btn" onclick="checkAnswer(3)" id="opt-3"></button>
        </div>
    </div>

    <div id="explanation-modal" class="modal">
        <div class="modal-content">
            <div id="exp-result" class="exp-title"></div>
            <div id="exp-movement" style="font-size: 1.3em; margin-bottom: 15px; color: #ffcc00; font-weight:bold;"></div>
            <div id="exp-text" class="exp-text"></div>
            <button id="exp-next-btn" class="next-btn" onclick="handleNextStep()">繼續航行</button>
        </div>
    </div>

    <div id="editor-modal" class="modal">
        <div class="modal-content">
            <h2 style="color:#00e5ff; margin-top:0;">編輯題庫 (JSON 格式)</h2>
            <p style="font-size:0.9em; text-align:left; color:#b2ebf2; margin-top:0;">請確保選項長度盡量一致，以免學生單靠長度猜測答案。</p>
            <textarea id="json-editor"></textarea>
            <div class="editor-btns">
                <button class="edit-btn" onclick="closeEditor()">取消</button>
                <button class="edit-btn" onclick="resetDefault()" style="color:#ff4d4d; border-color:#ff4d4d;">重置預設</button>
                <button class="next-btn" style="background-color:#00c853;" onclick="saveEditor()">儲存並重新開始</button>
            </div>
        </div>
    </div>

    <script>
        // 全新 20 題嚴謹實戰題，選項字數嚴格控制在 20-25 字左右
        const defaultQuestions = [
            { "q": "【反駁技巧】對方提出一個極端罕見的醫療事故，藉此證明該手術不安全。你最佳的回應策略是：", "o": [ "A. 直接指責對方舉例極端，完全不具備任何的社會普遍代表性。", "B. 順著對方例子推導，展現其邏輯套用在其他事物上會更加荒謬。", "C. 舉出另一個己方準備好的極端成功例子，用來抵消對方的影響。", "D. 迴避該例子的討論，重新申述己方的核心論點以及數據架構。" ], "a": 1, "exp": "B是歸謬法。A太過單薄；C會陷入互相舉例的泥巴戰；D會被視為逃避交鋒。順水推舟展現其邏輯荒謬最為致命。" },
            { "q": "【質詢防禦】質詢時，對方強勢逼問：「請問對方辯友，這份政策的具體預算到底是多少？」你最佳的防禦是：", "o": [ "A. 誠實回答不知道，因為我們只是學生，無法計算準確的預算。", "B. 隨便編造一個聽起來合理的數字，讓對方無法繼續在這個點糾纏。", "C. 點出辯論探討的是政策應然價值，而非實務操作的具體財政數字。", "D. 反問對方：「那請問你們反對這個政策，又會損失多少預算？」" ], "a": 2, "exp": "C精準切割了「價值辯論」與「細節辯論」的界線。A太露怯；B是嚴重的學術不端；D是無效的閃避反問。" },
            { "q": "【概念釐清】辯題「應否禁止整容」。反方以「身體自主權」為核心進行防禦。正方最具殺傷力的拆解是：", "o": [ "A. 身體自主並非絕對權利，如同自殘或吸毒也會被社會及法律禁止。", "B. 身體自主是西方的個人主義觀念，完全不符合我們傳統的道德觀。", "C. 整容會帶來非常嚴重的醫療風險，手術一旦失敗就會毀掉一生。", "D. 我們今天探討的是整體的社會風氣，根本不應該只看個人的權利。" ], "a": 0, "exp": "A直接用類比攻擊了「身體自主權的絕對性」，從底層邏輯瓦解對方的護城河。其他選項要麼偏題，要麼缺乏論證力。" },
            { "q": "【資料運用】當你發現對方引用的調查數據，其實是由一個帶有嚴重偏見的利益團體所贊助。你應該如何處理？", "o": [ "A. 立即大聲斥責對方造假，要求評判立刻扣分並取消對方的資格。", "B. 在發言時點出該數據的利益衝突，質疑其中立性並提供己方數據。", "C. 裝作沒發現，只要自己的論點講得夠好，評判自然會忽略假數據。", "D. 花費整整三分鐘的時間，詳細介紹該利益團體的背景與黑暗歷史。" ], "a": 1, "exp": "B是成熟辯手的做法：點出瑕疵、動搖公信力，並用己方數據覆蓋。A太情緒化；C等於放棄交鋒；D嚴重浪費己方時間。" },
            { "q": "【框架設定】比賽初期，正方試圖將「死刑存廢」的辯題，限縮在「只討論連環殺人犯」的情境。反方應對方式：", "o": [ "A. 接受對方的限縮，並努力證明即使是連環殺人犯也不應該判死刑。", "B. 指出辯題並未加上此限制，正方惡意縮小討論範圍屬於逃避舉證。", "C. 提出更極端的限縮，要求只能討論「精神失常的連環殺人犯」。", "D. 放棄準備好的講稿，立刻在場上即興構思針對連環殺人犯的論點。" ], "a": 1, "exp": "B是打擊「不當縮題」的標準動作。必須在第一時間把討論框架拉回常態，否則一旦接受A，己方將陷入極大劣勢。" },
            { "q": "【自由辯論】對方在自由辯論中不斷重複同一個已經被你回答過的問題，試圖營造你無法回應的假象。你應該：", "o": [ "A. 為了展現耐心，每次對方提問都用相同的字句重新回答一次。", "B. 憤怒地指責對方耳朵有問題，並要求對方立刻停止這種無賴行為。", "C. 點明已經回答過，用一句話濃縮答案，接著拋出己方的核心質詢。", "D. 保持沉默不作回應，讓全場觀眾和評判看出對方的詞窮與無理。" ], "a": 2, "exp": "C是止損與反擊的結合。點破對方的戰術，簡述答案以示磊落，並立刻奪回話題主導權。沉默在辯論場上通常等同默認。" },
            { "q": "【邏輯檢驗】對方主張：「因為玩暴力遊戲的人大多脾氣暴躁，所以暴力遊戲會導致人脾氣暴躁。」這犯了什麼謬誤？", "o": [ "A. 偷換概念：對方把「脾氣暴躁」這個主觀的形容詞當成了客觀事實。", "B. 訴諸大眾：對方認為因為大部分人都這樣想，所以這件事就是對的。", "C. 因果倒置：有可能是脾氣暴躁的人，在先天上更喜歡玩暴力遊戲。", "D. 循環論證：對方的結論只是把前提換了一種說法，沒有任何推導。" ], "a": 2, "exp": "C點出了「相關性不等於因果性」。觀察到兩個現象同時存在，不代表前者導致後者，很可能是後者導致前者。" },
            { "q": "【戰場切割】辯題為「安樂死應否合法化」。對方不斷強調現今醫療有誤診的可能。己方（正方）最清晰的切割是：", "o": [ "A. 誤診的機率其實非常低，現代醫學的進步已經可以完全避免誤診。", "B. 誤診是醫療技術的問題，不應以此否定病患擁有選擇善終的權利。", "C. 就算真的發生誤診，讓病患毫無痛苦地離世也比痛苦活著來得好。", "D. 對方一直談論誤診，完全是在恐嚇大眾，我們強烈譴責這種行為。" ], "a": 1, "exp": "B成功將「技術層面的瑕疵」與「價值層面的權利」進行切割。保住了安樂死的正當性，避免陷入醫學數據的糾纏。" },
            { "q": "【防禦陷阱】對方提問：「如果您的家人患上絕症痛苦不堪，您難道不會想讓他安樂死嗎？」這屬於什麼質詢陷阱？", "o": [ "A. 雙重標準陷阱：試圖證明你在台上和台下的道德標準不一致。", "B. 虛假兩難陷阱：逼迫你在兩個極端的選項中必須做出一個選擇。", "C. 滑坡推論陷阱：將一個小問題無限放大到不可收拾的災難地步。", "D. 個人情感陷阱：利用極端的個人道德困境來綁架客觀的政策討論。" ], "a": 3, "exp": "D（訴諸情感）是極常見的陷阱。政策辯論應以社會整體福祉為考量，對方試圖用個人私情來瓦解理性的政策論述。" },
            { "q": "【論點比較】比賽末段，雙方都承認自己的方案有弊端。此時結辯最關鍵的任務，是向評判展示什麼？", "o": [ "A. 竭盡全力向評判證明，我方方案的弊端其實是對方惡意捏造的。", "B. 誠實承認弊端，但證明我方解決的痛點更核心，且利益遠大於弊端。", "C. 放棄比較弊端，花費所有時間重新朗讀一次己方的一辯申論講稿。", "D. 強調雖然雙方都有弊端，但我方的辯手長得比較好看、口條更好。" ], "a": 1, "exp": "B是「損益比（Cost-Benefit Analysis）」。在實戰中沒有完美的政策，誰能證明自己的「性價比」更高，誰就能獲勝。" },
            // 以下為進入「深海區」後的 10 題
            { "q": "【深海區：價值底線】當對方主張「為了國家經濟快速發展，犧牲少數人的勞工權益是必要的陣痛」。你應如何反擊？", "o": [ "A. 經濟發展其實可以跟勞工權益並存，很多歐洲國家就做得非常完美。", "B. 人的基本權利不是可以用來交易的籌碼，不能以集體之名剝奪個體。", "C. 犧牲少數人根本無法帶來真正的經濟發展，只會造成社會的動盪。", "D. 那些被犧牲的少數人如果聯合起來抗議，政府最後還是會妥協的。" ], "a": 1, "exp": "B直接從「道德底線（不可褫奪的權利）」進行降維打擊，拒絕進入對方的功利主義計算框架中。" },
            { "q": "【深海區：拆解類比】對方說：「學校就像軍隊，學生必須絕對服從老師，才能保證紀律。」拆解此不當類比的方法是：", "o": [ "A. 舉出另一個類比：「學校應該像家庭一樣充滿愛，而不是像軍隊」。", "B. 點出核心差異：「軍隊的目的是作戰殺敵，學校的目的是啟發思想」。", "C. 質疑對方：「對方辯友有當過兵嗎？你根本不懂真正的軍隊是什麼」。", "D. 順著對方說：「既然是軍隊，那學生不聽話是不是要直接被槍斃呢」。" ], "a": 1, "exp": "B點出了類比的「本質差異」。不當類比之所以成立，是因為忽略了主體目標的不同。點出差異，類比即刻崩塌。" },
            { "q": "【深海區：數據解讀】對方提出：「實施該政策後，犯罪率下降了50%，可見政策極度有效。」你質疑該數據最有效的切入點：", "o": [ "A. 該城市的總人口數本來就在減少，犯罪率下降只是人口減少的錯覺。", "B. 這個數據是去年發布的，現在已經過時了，不能代表今年的真實情況。", "C. 下降50%可能只是從兩宗案件變成一宗，必須看絕對基數而非百分比。", "D. 犯罪率下降是全體市民共同努力的結果，不應該全部歸功於該項政策。" ], "a": 2, "exp": "C戳破了「百分比陷阱」。在沒有提供基數的情況下，巨大的百分比變化往往具有極強的誤導性。" },
            { "q": "【深海區：歸咎責任】討論「青年買不起房是個人還是社會的責任」。反方指責青年愛買奢侈品。正方最佳回應：", "o": [ "A. 青年買奢侈品是因為工作壓力太大，需要透過消費來獲得心靈慰藉。", "B. 房價漲幅遠超薪資增長是結構性問題，省下咖啡錢也湊不齊天價首期。", "C. 很多青年其實非常節儉，對方辯友不應該用刻板印象來污名化年輕人。", "D. 上一代的人年輕時也會買奢侈品，為什麼只針對我們這一代指指點點。" ], "a": 1, "exp": "B點出了「量級差距」。直接證明對方的指控（買奢侈品）即使為真，也無法解釋問題的巨大缺口（天價房價）。" },
            { "q": "【深海區：迴避交鋒】質詢時，你問了一個封閉式問題（是或否），對方卻開始滔滔不絕講故事。你應該：", "o": [ "A. 出於禮貌，安靜地等對方把長達兩分鐘的故事講完再繼續發問。", "B. 提高音量蓋過對方，強行打斷並要求評判立刻給對方予以警告。", "C. 禮貌但堅定地打斷：「謝謝您的故事，但請先明確回答是或不是」。", "D. 順著對方講的故事，開始在故事的細節裡面挑骨頭進行反駁。" ], "a": 2, "exp": "C是標準的控場技巧。既展現了風度（謝謝），又維護了己方質詢時間的權益，並將壓力重新丟回對方身上。" },
            { "q": "【深海區：處理新論點】在比賽最後環節（結辯），對方突然提出了一個全新的強力論點。你身為最後發言者應如何處理？", "o": [ "A. 盡全力現場即興構思反駁，花費大半的結辯時間來拆解這個新論點。", "B. 指出結辯提出新論點嚴重違規，請評判忽略，接著專注總結己方架構。", "C. 稱讚對方這個論點很有創意，但表示因為時間不夠所以我們不予討論。", "D. 感到驚慌失措，立刻改變自己原本的結辯大綱，試圖將其納入討論。" ], "a": 1, "exp": "B是利用賽制規則保護自己。結辯嚴禁提出新論點（New argument），點出違規後應立刻將焦點拉回全場交鋒。" },
            { "q": "【深海區：底層邏輯】當討論「科技發展讓人更自由還是更不自由」時，雙方的分歧點往往在於什麼？", "o": [ "A. 對「科技」的定義：到底是單指網路通訊技術，還是包含所有的發明。", "B. 對「自由」的定義：是選擇變多的外在自由，還是不被監控的內在自由。", "C. 對「發展」的定義：到底是指過去十年的發展，還是未來百年的發展。", "D. 對「人類」的定義：到底是指少數的富裕階層，還是全球的貧苦大眾。" ], "a": 1, "exp": "B是這類哲學辯題的命脈。正方通常看重「能力與選項的擴張」，反方通常看重「隱私剝奪與演算法控制」。" },
            { "q": "【深海區：政策替代性】我方反對對方提出的昂貴政策。除了證明其弊端，我們還必須在場上做什麼才能確保勝利？", "o": [ "A. 證明這個政策的提出者具有嚴重的道德瑕疵，不值得社會大眾信任。", "B. 提出一個成本更低、副作用更小，且同樣能解決問題的「替代方案」。", "C. 告訴評判這個社會問題其實根本不存在，一切都是對方憑空幻想出來的。", "D. 不斷重申政府的預算有限，任何花費龐大資金的政策都應該被否決。" ], "a": 1, "exp": "B是政策辯論反方的進階技巧「相抗計畫（Counter-plan）」。光說別人不好是不夠的，證明有更好的選擇才能鎖定勝局。" },
            { "q": "【深海區：破解二分法】對方質問：「你一直反對經濟開發，難道你要全人類回到原始社會過吃樹皮的生活嗎？」", "o": [ "A. 吃樹皮也沒什麼不好，至少那時候的人類沒有現代文明的文明病。", "B. 對方這是在強迫我們進行極端的二選一，忽略了永續發展的中庸之道。", "C. 我們並不是反對所有的經濟開發，我們只是反對你們今天提出的開發案。", "D. 如果環境被完全破壞殆盡，到時候人類連樹皮都沒有得吃，只能等死。" ], "a": 1, "exp": "B直接點破了「虛假兩難（非黑即白）」的邏輯謬誤。指出除了極端開發與極端原始外，還有第三條路。" },
            { "q": "【深海區：最終昇華】在激烈的交鋒後，結辯最後的「價值昇華」最忌諱出現哪種情況？", "o": [ "A. 語氣過於激動，甚至流下眼淚，讓整場比賽的氣氛變得非常沉重。", "B. 引用了太多名人名言，導致整段結詞聽起來像是拼湊而成的文章。", "C. 昇華的價值與己方整場的邏輯架構毫無關聯，淪為空洞的道德說教。", "D. 結詞的時間控制不佳，在時間提示鈴響起後還講了十幾秒才結束。" ], "a": 2, "exp": "C是結辯大忌（價值脫節）。昇華必須是建立在己方實質論證之上的自然推導，否則就像沒有地基的空中樓閣，無法打動評判。" }
        ];

        let questions = [];
        let currentIndex = 0;
        let isAnswering = false;

        // 遊戲狀態
        let boatDistance = 5; 
        let wrongCount = 0;
        let gameStatus = "playing"; // playing, win, lose

        // 鯊魚手段狀態
        let dashAvailable = true;
        let dashActive = false;
        let dashSecondChance = false;
        
        let phase2Unlocked = false;
        let phase2Active = false;

        function initGame() {
            const savedData = localStorage.getItem('debateQuizData');
            if (savedData) {
                try { questions = JSON.parse(savedData); } 
                catch (e) { questions = JSON.parse(JSON.stringify(defaultQuestions)); }
            } else {
                questions = JSON.parse(JSON.stringify(defaultQuestions));
            }
            startGame();
        }

        function startGame() {
            currentIndex = 0;
            boatDistance = 5;
            wrongCount = 0;
            gameStatus = "playing";
            
            // 重置技能狀態
            dashAvailable = true;
            dashActive = false;
            dashSecondChance = false;
            phase2Unlocked = false;
            phase2Active = false;
            
            const btnDash = document.getElementById('btn-dash');
            btnDash.disabled = false;
            btnDash.className = 'ability-btn';
            btnDash.innerText = "🩸 鯊魚手段：猛衝 (主動)";

            const btnPhase2 = document.getElementById('btn-phase2');
            btnPhase2.disabled = true;
            btnPhase2.className = 'ability-btn';
            btnPhase2.innerText = "🌊 深海區：第二階段 (未解鎖)";

            document.getElementById('action-msg').innerText = "提示：保持選項長度一致，專注分析底層邏輯。";

            updateUI();
            loadQuestion();
        }

        function updateUI() {
            document.getElementById('q-counter').innerText = `第 ${currentIndex + 1} 題 / 共 ${questions.length} 題`;
            document.getElementById('distance-text').innerText = `距離被吃掉: ${boatDistance} 格`;
            document.getElementById('wrong-text').innerText = `錯誤次數: ${wrongCount} / 5`;

            let safeDist = Math.max(0, boatDistance - 1);
            let waterAhead = Math.max(0, 15 - safeDist);
            document.getElementById('track-container').innerText = `🦈` + `🌊`.repeat(safeDist) + `⛵` + `〰️`.repeat(waterAhead);

            // 檢查深海區解鎖 (第11題開始，即 currentIndex >= 10)
            if (currentIndex >= 10 && !phase2Unlocked && gameStatus === "playing") {
                phase2Unlocked = true;
                phase2Active = true; // 強制啟動
                const btnPhase2 = document.getElementById('btn-phase2');
                btnPhase2.disabled = false;
                btnPhase2.classList.add('danger');
                btnPhase2.innerText = "⚠️ 進入深海區：錯退2格，對進1格！";
                
                // 動態提示
                document.getElementById('action-msg').innerText = "🚨 警告：進入深海區！容錯率大幅降低！";
                document.getElementById('action-msg').style.color = "#ff1744";
            }
        }

        function toggleDash() {
            if (isAnswering || !dashAvailable) return;
            dashActive = !dashActive;
            const btn = document.getElementById('btn-dash');
            btn.classList.toggle('active', dashActive);
            
            let msg = document.getElementById('action-msg');
            if (dashActive) {
                msg.innerText = "🩸 鯊魚蓄力猛衝！(若答錯可刪除該選項重答，若再錯退兩格)";
                msg.style.color = "#ffcc00";
            } else {
                msg.innerText = "";
            }
        }

        function loadQuestion() {
            isAnswering = false;
            dashSecondChance = false;
            const qData = questions[currentIndex];
            document.getElementById('question-box').innerText = qData.q;
            
            for (let i = 0; i < 4; i++) {
                const btn = document.getElementById(`opt-${i}`);
                btn.innerText = qData.o[i];
                btn.className = 'option-btn'; 
                btn.disabled = false;
            }
            updateUI();
        }

        function checkAnswer(selectedIndex) {
            if (isAnswering && !dashSecondChance) return; // 鎖定防連點
            
            const qData = questions[currentIndex];
            const correctIndex = qData.a;
            const selectedBtn = document.getElementById(`opt-${selectedIndex}`);
            
            let isCorrect = (selectedIndex === correctIndex);

            // 處理猛衝 (第一次答錯)
            if (dashActive && !isCorrect && !dashSecondChance) {
                dashSecondChance = true; // 進入第二次機會狀態
                selectedBtn.classList.add('wrong');
                selectedBtn.disabled = true; // 封鎖選錯的答案
                
                let msg = document.getElementById('action-msg');
                msg.innerText = "💥 鯊魚猛衝落空！你還有一次機會，再錯將退後兩格！";
                msg.style.color = "#ff4d4d";
                return; // 終止本次結算，等待玩家再選
            }

            // --- 正式結算階段 ---
            isAnswering = true; // 鎖定畫面
            const correctBtn = document.getElementById(`opt-${correctIndex}`);

            for (let i = 0; i < 4; i++) {
                document.getElementById(`opt-${i}`).disabled = true;
            }

            let movementText = "";
            let forwardStep = 1;
            let backwardStep = phase2Active ? 2 : 1; // 第二階段懲罰加倍

            // 如果是在猛衝的第二機會下答錯，懲罰固定為2
            if (dashSecondChance && !isCorrect) {
                backwardStep = 2;
            }

            if (isCorrect) {
                selectedBtn.classList.add('correct');
                boatDistance += forwardStep;
                movementText = `⛵ 漂亮！邏輯正確，小船向前行 ${forwardStep} 格！`;
            } else {
                selectedBtn.classList.add('wrong');
                correctBtn.classList.add('correct');
                boatDistance -= backwardStep;
                wrongCount++;
                movementText = `⚠️ 邏輯陷阱！退後 ${backwardStep} 格！鯊魚逼近！`;
            }

            // 清除猛衝技能狀態 (不論對錯，只要結算就消耗)
            if (dashActive) {
                dashActive = false;
                dashAvailable = false;
                dashSecondChance = false;
                const btnDash = document.getElementById('btn-dash');
                btnDash.disabled = true;
                btnDash.classList.remove('active');
                btnDash.innerText = "🩸 猛衝 (已消耗)";
            }
            
            updateUI();

            // 判斷遊戲狀態
            if (boatDistance <= 0) {
                gameStatus = "lose_eaten";
            } else if (wrongCount >= 5) {
                gameStatus = "lose_mistakes";
            } else if (currentIndex === questions.length - 1 && isCorrect) {
                gameStatus = "win";
            }

            setTimeout(() => {
                showExplanation(isCorrect, movementText, qData.exp);
            }, 1200);
        }

        function showExplanation(isCorrect, moveText, explanation) {
            const modal = document.getElementById('explanation-modal');
            const title = document.getElementById('exp-result');
            const moveDiv = document.getElementById('exp-movement');
            const text = document.getElementById('exp-text');
            const nextBtn = document.getElementById('exp-next-btn');

            moveDiv.innerText = moveText;

            if (gameStatus === "playing") {
                title.innerText = isCorrect ? "✅ 拆解成功" : "❌ 墜入陷阱";
                title.style.color = isCorrect ? "#00c853" : "#ff1744";
                nextBtn.innerText = "繼續航行";
            } else {
                title.innerText = "🚨 遊戲結束";
                title.style.color = "#ff4d4d";
                nextBtn.innerText = "查看結果";
            }
            
            text.innerText = explanation ? `【戰術覆盤】\n${explanation}` : "此題未提供題解。";
            modal.style.display = 'flex';
        }

        function handleNextStep() {
            document.getElementById('explanation-modal').style.display = 'none';
            document.getElementById('action-msg').innerText = "";
            
            if (gameStatus === "playing") {
                currentIndex++;
                loadQuestion();
            } else {
                showFinalResult();
            }
        }

        function showFinalResult() {
            const modal = document.getElementById('explanation-modal');
            const title = document.getElementById('exp-result');
            const moveDiv = document.getElementById('exp-movement');
            const text = document.getElementById('exp-text');
            const nextBtn = document.getElementById('exp-next-btn');

            moveDiv.innerText = "";

            if (gameStatus === "win") {
                title.innerText = "🏆 稱霸深海！";
                title.style.color = "#ffcc00";
                text.innerText = `太強了！你成功拆解了所有實戰陷阱，順利擺脫了鯊魚！\n\n最終安全距離：${boatDistance} 格\n總共錯誤：${wrongCount} 次\n你已經具備高階辯手的邏輯素質！`;
            } else if (gameStatus === "lose_eaten") {
                title.innerText = "☠️ 葬身魚腹";
                title.style.color = "#ff1744";
                text.innerText = `距離歸零，小船被鯊魚無情吞噬！\n你在第 ${currentIndex + 1} 題被邏輯陷阱困住。\n不要氣餒，釐清戰術覆盤後重新出發！`;
            } else if (gameStatus === "lose_mistakes") {
                title.innerText = "💥 船體崩潰";
                title.style.color = "#ff1744";
                text.innerText = `累積答錯 5 題，船體承受不住深海水壓沉沒了！\n你在第 ${currentIndex + 1} 題止步。\n請仔細檢討每一次的戰術覆盤！`;
            }

            nextBtn.innerText = "重新挑戰";
            nextBtn.onclick = () => {
                modal.style.display = 'none';
                startGame();
                nextBtn.onclick = handleNextStep; 
            };
            modal.style.display = 'flex';
        }

        function openEditor() { document.getElementById('editor-modal').style.display = 'flex'; }
        function closeEditor() { document.getElementById('editor-modal').style.display = 'none'; }
        
        function saveEditor() {
            try {
                const newJson = document.getElementById('json-editor').value;
                const parsed = JSON.parse(newJson);
                if (!Array.isArray(parsed) || parsed.length === 0) throw new Error("必須是陣列 []");
                localStorage.setItem('debateQuizData', JSON.stringify(parsed));
                questions = parsed;
                alert("儲存成功！系統將重新載入遊戲。");
                closeEditor();
                startGame();
            } catch (e) {
                alert("JSON 格式有誤！\n錯誤訊息: " + e.message);
            }
        }

        function resetDefault() {
            if(confirm("確定要刪除你修改的題目，恢復預設嗎？")) {
                localStorage.removeItem('debateQuizData');
                document.getElementById('json-editor').value = JSON.stringify(defaultQuestions, null, 4);
                questions = JSON.parse(JSON.stringify(defaultQuestions));
                closeEditor();
                startGame();
            }
        }

        window.onload = initGame;
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>辯論生存戰：鯊魚的追擊</title>
    <style>
        body {
            background-color: #001220;
            background-image: linear-gradient(to bottom, #001220, #002b4a);
            color: #e0f7fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box;
        }
        
        /* 預設：淺海區 (藍色主題) */
        #game-container {
            width: 100%; max-width: 850px;
            background: rgba(0, 20, 40, 0.85);
            border: 2px solid #00e5ff; 
            border-radius: 15px; padding: 30px;
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.4); 
            text-align: center; position: relative;
            transition: all 0.8s ease;
        }
        #game-container h1 { 
            color: #00e5ff; 
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.6); 
            margin-top: 0; 
            transition: all 0.8s ease;
        }
        #track-container {
            font-size: 2em; letter-spacing: 2px; margin-bottom: 20px;
            background: rgba(0,0,0,0.4); padding: 15px; border-radius: 30px; 
            border: 1px solid #00e5ff;
            overflow: hidden; white-space: nowrap;
            transition: all 0.8s ease;
        }

        /* 觸發：深海區 (紅色主題) 第10題起 */
        #game-container.deep-sea {
            border-color: #ff4d4d;
            box-shadow: 0 0 35px rgba(255, 77, 77, 0.6);
            background: rgba(40, 0, 10, 0.85);
        }
        #game-container.deep-sea h1 {
            color: #ff4d4d;
            text-shadow: 0 0 10px rgba(255, 77, 77, 0.6);
        }
        #game-container.deep-sea #track-container {
            border-color: #ff4d4d;
            background: rgba(20, 0, 0, 0.6);
        }

        /* 終極觸發：死神海域 (暗紅/血紅主題) 最後10題 */
        #game-container.death-zone {
            border-color: #b71c1c;
            box-shadow: 0 0 45px rgba(183, 28, 28, 0.9);
            background: rgba(30, 0, 5, 0.95);
        }
        #game-container.death-zone h1 {
            color: #ff1744;
            text-shadow: 0 0 20px rgba(255, 23, 68, 0.9);
        }
        #game-container.death-zone #track-container {
            border-color: #ff1744;
            background: rgba(20, 0, 0, 0.8);
        }
        
        .header-tools { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .edit-btn { background-color: transparent; border: 1px solid #80deea; color: #80deea; padding: 5px 10px; border-radius: 5px; cursor: pointer; }
        .edit-btn:hover { background-color: #80deea; color: #001f3f; }

        #status-bar {
            background: rgba(0, 0, 0, 0.5); padding: 10px; border-radius: 10px; margin-bottom: 15px;
            display: flex; justify-content: space-between; font-weight: bold; color: #ffcc00;
        }
        
        #shark-abilities { display: flex; justify-content: center; margin-bottom: 20px; gap: 15px; }
        .ability-btn {
            background-color: #003366; color: #80deea; border: 2px solid #00e5ff;
            border-radius: 10px; padding: 12px 20px; cursor: pointer; font-weight: bold; flex-grow: 1;
            transition: all 0.2s; font-size: 1.05em;
        }
        .ability-btn:hover:not(:disabled) { background-color: #00e5ff; color: #001f3f; }
        .ability-btn:disabled { opacity: 0.5; cursor: not-allowed; border-color: #555; background-color: #222; color: #777;}
        .ability-btn.active { background-color: #ffcc00; color: #000; border-color: #ffcc00; box-shadow: 0 0 15px #ffcc00; }
        
        #game-container.deep-sea .ability-btn { border-color: #ff4d4d; color: #ff9999; background-color: #4a0000; }
        #game-container.deep-sea .ability-btn.danger { background-color: #800000; color: #fff; animation: pulse 2s infinite; }
        
        #game-container.death-zone .ability-btn { border-color: #ff1744; color: #ff1744; background-color: #2a0000; }
        #game-container.death-zone .ability-btn.danger { background-color: #8b0000; color: #fff; animation: pulse-death 1s infinite; }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 77, 77, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(255, 77, 77, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 77, 77, 0); }
        }
        @keyframes pulse-death {
            0% { box-shadow: 0 0 0 0 rgba(255, 23, 68, 0.8); }
            70% { box-shadow: 0 0 0 25px rgba(255, 23, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 23, 68, 0); }
        }

        #action-msg { color: #ffcc00; font-weight: bold; min-height: 28px; margin-bottom: 15px; font-size: 1.15em; }

        #question-box {
            background-color: rgba(0, 40, 70, 0.7); border: 2px solid #80deea; border-radius: 10px;
            padding: 25px; font-size: 1.25em; margin-bottom: 25px; min-height: 80px;
            display: flex; align-items: center; justify-content: center; line-height: 1.5; font-weight: bold;
        }
        #options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        @media (max-width: 600px) { #options-grid { grid-template-columns: 1fr; } }
        
        .option-btn {
            background-color: rgba(0, 20, 40, 0.8); color: #fff; border: 1px solid #4dd0e1;
            border-radius: 10px; padding: 16px 20px; font-size: 1.1em; cursor: pointer;
            transition: all 0.3s ease; text-align: left; line-height: 1.4;
        }
        .option-btn:hover:not(:disabled) { background-color: #005c97; border-color: #00e5ff; }
        .option-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .option-btn.correct { background-color: #00c853 !important; border-color: #00e5ff !important; box-shadow: 0 0 15px #00c853; opacity: 1; }
        .option-btn.wrong { background-color: #d50000 !important; border-color: #ff1744 !important; box-shadow: 0 0 15px #d50000; opacity: 0.8; text-decoration: line-through; }

        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 10, 20, 0.95); z-index: 10;
            flex-direction: column; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box;
        }
        .modal-content {
            background: #001a33; border: 2px solid #00e5ff; border-radius: 15px; padding: 30px;
            max-width: 650px; width: 100%; text-align: center; box-shadow: 0 0 30px rgba(0, 229, 255, 0.3);
            transition: all 0.5s ease;
        }
        #game-container.deep-sea ~ .modal .modal-content {
            border-color: #ff4d4d; box-shadow: 0 0 30px rgba(255, 77, 77, 0.3);
        }
        #game-container.death-zone ~ .modal .modal-content {
            border-color: #ff1744; box-shadow: 0 0 40px rgba(255, 23, 68, 0.5);
        }
        
        .exp-title { font-size: 1.7em; margin-bottom: 15px; font-weight: bold; }
        .exp-text { font-size: 1.15em; line-height: 1.6; margin-bottom: 25px; text-align: left; color: #b2ebf2; }
        .next-btn { background-color: #00e5ff; color: #001220; border: none; border-radius: 10px; padding: 12px 30px; font-size: 1.2em; cursor: pointer; font-weight: bold; transition: 0.3s;}
        .next-btn:hover { background-color: #80deea; }
        #game-container.deep-sea ~ .modal .next-btn { background-color: #ff4d4d; color: #fff; }
        #game-container.deep-sea ~ .modal .next-btn:hover { background-color: #ff6666; }
        #game-container.death-zone ~ .modal .next-btn { background-color: #ff1744; color: #fff; }
        #game-container.death-zone ~ .modal .next-btn:hover { background-color: #d50000; }

        #editor-modal .modal-content { max-width: 800px; height: 80vh; display: flex; flex-direction: column; }
        #json-editor { width: 100%; flex-grow: 1; background: #001f3f; color: #00e5ff; border: 1px solid #00e5ff; padding: 10px; font-family: monospace; font-size: 14px; margin-bottom: 15px; resize: none; }
        .editor-btns { display: flex; justify-content: space-between; }
    </style>
</head>
<body>

    <div id="game-container">
        <div class="header-tools">
            <button class="edit-btn" onclick="openEditor()">⚙️ 編輯題目</button>
            <div style="font-weight: bold; color: #b2ebf2; font-size: 1.2em;" id="q-counter">準備載入...</div>
        </div>

        <h1>🦈 鯊魚的追擊：實戰深海 ⛵</h1>
        
        <div id="status-bar">
            <span id="distance-text">距離被吃掉: 5 格</span>
            <span id="wrong-text">連續錯誤: 0 / 5</span>
        </div>
        
        <div id="track-container">🦈🌊🌊🌊🌊⛵</div>

        <div id="shark-abilities">
            <button id="btn-dash" class="ability-btn" onclick="toggleDash()">🩸 鯊魚手段：猛衝 (主動)</button>
            <button id="btn-phase2" class="ability-btn" disabled>🌊 深海區：第二階段 (未解鎖)</button>
        </div>

        <div id="action-msg"></div>

        <div id="question-box">載入題目中...</div>
        
        <div id="options-grid">
            <button class="option-btn" onclick="checkAnswer(0)" id="opt-0"></button>
            <button class="option-btn" onclick="checkAnswer(1)" id="opt-1"></button>
            <button class="option-btn" onclick="checkAnswer(2)" id="opt-2"></button>
            <button class="option-btn" onclick="checkAnswer(3)" id="opt-3"></button>
        </div>
    </div>

    <div id="explanation-modal" class="modal">
        <div class="modal-content">
            <div id="exp-result" class="exp-title"></div>
            <div id="exp-movement" style="font-size: 1.3em; margin-bottom: 15px; color: #ffcc00; font-weight:bold;"></div>
            <div id="exp-text" class="exp-text"></div>
            <button id="exp-next-btn" class="next-btn" onclick="handleNextStep()">繼續航行</button>
        </div>
    </div>

    <div id="editor-modal" class="modal">
        <div class="modal-content">
            <h2 style="color:#00e5ff; margin-top:0;">編輯題庫 (JSON 格式)</h2>
            <p style="font-size:0.9em; text-align:left; color:#b2ebf2; margin-top:0;">修改後儲存即可測試。若要永久生效，請複製回 GitHub。</p>
            <textarea id="json-editor"></textarea>
            <div class="editor-btns">
                <button class="edit-btn" onclick="closeEditor()">取消</button>
                <button class="edit-btn" onclick="resetDefault()" style="color:#ff4d4d; border-color:#ff4d4d;">重置預設</button>
                <button class="next-btn" style="background-color:#00c853; color:#fff;" onclick="saveEditor()">儲存並重新開始</button>
            </div>
        </div>
    </div>

    <script>
        const defaultQuestions = [
            {"q": "在傳統辯論賽制中，負責在比賽最後總結全場交鋒點、重申己方核心價值的辯手稱為：", "o": ["A. 負責開篇立論的主辯", "B. 負責展開的第一副辯", "C. 負責交鋒的第二副辯", "D. 負責總結全場的結辯"], "a": 3, "exp": "結辯的職責是盤點全場交鋒，梳理己方邏輯並進行價值昇華，絕不應在此環節提出全新的論據。"},
            {"q": "辯論賽中，雙方輪流交替發言，節奏最緊湊且允許直接駁斥對方的環節是：", "o": ["A. 主辯申論階段", "B. 台下發問環節", "C. 自由辯論環節", "D. 結辯陳詞階段"], "a": 2, "exp": "自由辯論是雙方陣營共享一定時間，交替站立發言的環節，最考驗雙方的臨場反應與團隊配合。"},
            {"q": "準備一場辯論比賽，全隊拿到辯題後的第一步通常是：", "o": ["A. 分配主辯和副辯的講稿字數", "B. 進行破題並定義核心關鍵字", "C. 撰寫結辯的價值昇華講稿", "D. 尋找對手可能出錯的黑材料"], "a": 1, "exp": "萬丈高樓平地起，「破題與定義」是確立己方討論範圍和底線的第一步，定義錯了整場邏輯都會崩塌。"},
            {"q": "關於辯論中的「舉證責任」，以下哪一項描述最為準確且符合底層邏輯？", "o": ["A. 雙方都必須平均地提出同等數量的證據", "B. 提出主張的一方必須提出證據支持主張", "C. 為了保證公平反對方必須提出反證數據", "D. 只有正方主辯需要承擔所有的舉證責任"], "a": 1, "exp": "「誰主張，誰舉證」是法學與辯論的鐵律。若你提出一個觀點，你就必須拿出證據，而不是要對方去證明「你錯了」。"},
            {"q": "在政策性辯論中，討論「必要性（需根）」時，我們實質上是在探討什麼？", "o": ["A. 該政策能否在執行後徹底解決社會問題", "B. 社會問題是否深植現有制度且必須改變", "C. 該問題目前是否已經為社會帶來極大損害", "D. 該政策執行後帶來的利益是否大於其弊端"], "a": 1, "exp": "必要性探討的是「現狀為何無法自我修復」。如果問題可以透過現有制度解決，就不需要一個全新的政策。"},
            {"q": "「滑坡謬誤」與正當的「連鎖推論」它們之間最大的區別在於：", "o": ["A. 滑坡謬誤推導出的結果通常都是災難性的", "B. 滑坡缺乏機率考量而連鎖具有嚴謹因果論證", "C. 滑坡謬誤是反方技巧而連鎖推論是正方技巧", "D. 滑坡謬誤推導步驟超過三個而連鎖推論較少"], "a": 1, "exp": "滑坡謬誤的關鍵在於「無限放大微小的機率」，把不必然發生的 A->B->C 說成絕對會發生。"},
            {"q": "判斷一個定義是「偷換概念」還是「重新定義」核心標準是：", "o": ["A. 該定義是否在辯論策略上完全對己方有利", "B. 該定義是否偏離大眾認知並逃避實質交鋒", "C. 該定義是否沒有被任何權威字典正式收錄", "D. 該定義是否過於創新導致對手無法即時反駁"], "a": 1, "exp": "好的重新定義能賦予辯題新視角；但如果定義嚴重脫離常理，讓辯題失去探討價值，就是惡意偷換概念。"},
            {"q": "當我們評估一個論點是否具有「排他性（唯一性）」時，我們在評估什麼？", "o": ["A. 這個論點的立場是否極端到排斥折衷方案", "B. 政策好處是否只能由我方立場實現對方不能", "C. 該論點是否能同時解決雙方痛點達到雙贏", "D. 我方執行這個解決方案的效率是否明顯更高"], "a": 1, "exp": "如果正方提出政策的好處，反方不推行政策也能達到，那麼這個好處就不具備「排他性」，正方便無法藉此得分。"},
            {"q": "辯論中常交鋒的「應然」與「實然（可行）」層面，以下區分何者最準確？", "o": ["A. 「應然」代表未來的願景，「可行」代表過去的教訓", "B. 「應然」探討價值上應該如何，「可行」探討現實如何", "C. 「應然」是政策實施的前提，「可行」是實施的副作用", "D. 「應然」論點基於感性訴求，「可行」論點基於客觀數據"], "a": 1, "exp": "應然（Ought to be）探討價值觀念與理想標準；實然探討客觀事實與現狀限制。兩者交鋒是辯論的核心。"},
            {"q": "辯題「中學生應否全面禁用智能手機」。正方提出：「學生自制力差，沉迷導致成績下降」。反方最佳的釜底抽薪是：", "o": ["A. 沉迷是因為家長缺乏陪伴，與手機本身無關。", "B. 考試成績不是衡量學生價值的唯一客觀標準。", "C. 禁用手機會剝奪網上學習的權利，完全得不償失。", "D. 禁用無法解決自制力問題，學生依然會沉迷電腦。"], "a": 3, "exp": "D 直接攻擊了正方的「解決力」。指出即使執行正方政策，也無法解決原本的痛點，是最高效的反駁。"},
            {"q": "辯題「金錢是萬惡之源」。正方列舉大量因金錢引發的貪污、謀殺案。反方哪種回應策略最能有效拆解對方邏輯？", "o": ["A. 可以列舉更多由其他原因（如感情）引發的犯罪。", "B. 可以指出金錢也做了很多好事（如捐款建醫院）。", "C. 點出對方混淆了「金錢工具」和「人性貪婪」的本質。", "D. 直接質疑對方提出犯罪數據的來源是否具備權威性。"], "a": 2, "exp": "C 選項精準切割了「工具」與「人性」，指出對方歸因錯誤。A和B都等於默認了金錢是源頭之一，只是在比重上討價還價。"},
            {"q": "對方質問：「難道你敢說，你從來沒有因為滑手機而忽略身邊家人嗎？」面對這類誘導性提問，最佳回應是：", "o": ["A. 承認這只是我個人自制力問題，不能代表全體。", "B. 嚴正要求對方不要進行人身攻擊或窺探隱私。", "C. 點出打破地域限制的連結是常態親近，反客為主。", "D. 憤怒反問對方自己難道就沒有忽略過身邊家人嗎。"], "a": 2, "exp": "不要被對方的特例或情緒勒索困住。C 坦然面對質疑，並將「親近」的定義擴展到更宏觀的常態連結，反客為主。"},
            {"q": "對方提出極度荒謬且沒數據支持的極端例子（如：吃快餐會導致基因突變）。你接續發言時應如何處理？", "o": ["A. 花兩分鐘時間詳細論證為什麼吃快餐不會突變。", "B. 簡單點出對方犯了「滑坡謬誤」並迅速拉回主戰場。", "C. 在台上大聲嘲笑對方缺乏科學常識並要求評判扣分。", "D. 順著對方幽默反擊說如果突變會變成超級英雄拯救地球。"], "a": 1, "exp": "對方的荒謬例子往往是「泥巴戰」陷阱。B 是最高效的止損方式，不浪費己方寶貴的申論時間在無意義的假議題上。"},
            {"q": "辯題「發展經濟比保護環境更重要」。反方說：「如果地球毀滅了，賺再多錢有什麼用？」正方最合適的反駁是：", "o": ["A. 地球環境並沒有那麼脆弱，對方的擔憂是杞人憂天。", "B. 經濟發展正是研發新能源與實行環保政策的強大後盾。", "C. 發展經濟能推動航天科技，以後我們可以集體移民火星。", "D. 經濟一旦崩潰窮人會先餓死，這比環境毀滅發生得更早。"], "a": 1, "exp": "B 選項實行了「包容性反駁」。承認環保重要，但論證「經濟是環保的前提」，從而將對方的價值納入我方的邏輯框架下。"},
            {"q": "對方在自由辯論利用語速連續拋出三個細節問題。你接過麥克風後應該？", "o": ["A. 為了展現氣勢，同樣以極快語速逐一回答所有問題。", "B. 向評判抱怨對方問題過多且零碎，要求對方重新發問。", "C. 用一個底層邏輯統一回應所有問題，隨即反問核心點。", "D. 為了節省時間，只挑其中最容易解答的一題進行回答。"], "a": 2, "exp": "連珠炮提問通常是為了打亂節奏。C 展現了高度的概括力與控場力，化繁為簡，並重新奪回戰場主導權。"},
            {"q": "對方結辯試圖用極度煽情的悲慘命案收尾賺取同情。我方結辯應如何化解？", "o": ["A. 嚴厲指責對方在莊嚴的比賽中打感情牌是非常不專業的。", "B. 立刻拋棄講稿，講述一個更悲慘的案件來進行情感反擊。", "C. 展現同理心，但冷靜點出悲劇正是對方提倡的制度所致。", "D. 完全無視對方的情感渲染，繼續面無表情地念完預寫稿。"], "a": 2, "exp": "面對感性攻勢，強硬反駁顯得冷血。C 做到「順勢而為」，接住對方的情緒，但將肇因歸咎於對方的立場，實現借力打力。"},
            {"q": "當比賽陷入「定義戰」（雙方各執一詞平行時空）且僵持不下時，最佳的推進策略是：", "o": ["A. 堅持己方定義，不斷重複朗讀權威字典解釋直到時間結束。", "B. 比較雙方定義在現實社會中，哪一個更有現實探討的意義。", "C. 為了讓比賽順利進行，直接妥協並全盤接受對方的定義。", "D. 嚴厲指責對方惡意曲解辯題字眼，破壞了整場比賽的觀賞性。"], "a": 1, "exp": "字典不能解決所有爭端。B 是「比較定義價值」的進階技巧，告訴評判「為什麼用我的定義來討論這場比賽，對社會更有幫助」。"},
            {"q": "對方逼問：「你到底認為『生命』更重要，還是『自由』更重要？必須選一個！」最能破解此陷阱的話術是：", "o": ["A. 隨便選擇一個對方比較難反駁的立場，然後開始硬拗。", "B. 拒絕回答這個問題，並表示對方的假設過於極端毫無意義。", "C. 點破這是非黑即白的陷阱，指出保障生命與最大化自由不衝突。", "D. 不正面回答問題，直接反問對方在這種情況下會作何選擇。"], "a": 2, "exp": "這類逼問屬於「非黑即白」的邏輯陷阱。C 直接點破陷阱本質，跳出二元對立框架，展現了更周全的價值觀。"},
            {"q": "對方舉例：「馬斯克懂物理、編程、商業，所以通才絕對更吃香。」最佳回應是：", "o": ["A. 強調馬斯克其實本質上是個專才，他最專精的就是商業營銷。", "B. 點出馬斯克是極端倖存者偏差的個別例子，不能代表普遍社會。", "C. 反駁指出馬斯克旗下的各大科技公司，聘請的員工全部都是專才。", "D. 舉出愛因斯坦等歷史偉人來證明專才在歷史上同樣有巨大貢獻。"], "a": 1, "exp": "B 選項精準運用了「普遍性 vs 特殊性」的拆解技巧。戳破對方用「倖存者偏差」來概括整體的邏輯謬誤。"},
            {"q": "在激烈的交鋒後，結辯最後的「價值昇華」最忌諱出現哪種情況？", "o": ["A. 語氣過於激動甚至流下眼淚，讓整場比賽的氣氛變得非常沉重。", "B. 引用了太多名人名言，導致整段結詞聽起來像是拼湊而成的文章。", "C. 昇華的價值與己方整場的實質邏輯架構毫無關聯，淪為空洞說教。", "D. 結詞的時間控制極度不佳，在時間提示鈴響起後還講了十幾秒。"], "a": 2, "exp": "C 是結辯大忌（價值脫節）。昇華必須是建立在己方實質論證之上的自然推導，否則就像沒有地基的空中樓閣，無法打動評判。"},
            {"q": "當對方第一副辯提出一個全新的政策框架，且內容極度複雜，我方第二副辯最佳應對是：", "o": ["A. 放棄準備好的反駁稿，花三分鐘全面梳理對方的政策細節。", "B. 點出該政策過於複雜難以執行，並迅速用核心邏輯檢驗其漏洞。", "C. 向評判抗議對方在副辯階段提出新框架屬於嚴重違規。", "D. 假裝沒有聽懂對方的複雜政策，繼續照念己方原定的攻擊講稿。"], "a": 1, "exp": "面對複雜新框架，切忌被牽著鼻子走。B 做法能以快打慢，抓大放小，利用對方政策的複雜性反證其不可行。"},
            {"q": "在自由辯論中，對方一直迴避我方主攻的核心問題，反而不斷拋出枝微末節的防守反擊。我方應：", "o": ["A. 順著對方的枝微末節逐一澄清，證明對方連小問題都錯。", "B. 點出對方正在「遊花園」逃避核心，重申該問題並施加壓力。", "C. 同樣開始拋出無關痛癢的問題，與對方進行拖延時間的泥巴戰。", "D. 保持沉默不發言，讓評判看出對方是在無理取鬧、浪費時間。"], "a": 1, "exp": "B 是控制戰場的主動權。不要在對方的弱勢戰場糾纏，點破對方的逃避心態能有效引導評判的觀感。"},
            {"q": "辯題「香港應落實全民退保」。反方質疑政府財政無法負擔，正方最具說服力的回應是：", "o": ["A. 指出政府過去的基建工程也花了很多錢，為何不能花在長者身上。", "B. 提出具體的融資方案（如加徵利得稅），證明財政上完全具備可行性。", "C. 強調照顧長者是社會不可推卸的道德責任，不應斤斤計較金錢成本。", "D. 質疑對方的數據是誇大其詞，香港政府擁有龐大的財政儲備絕對夠付。"], "a": 1, "exp": "面對財政質疑，B（提出具體方案）是唯一能實質解決問題的做法。訴諸道德或質疑對方都無法填補財政邏輯的空缺。"},
            {"q": "對方引用了一份「未經同行評審的智庫報告」作為核心證據。我方在反駁時最應該強調什麼？", "o": ["A. 該報告的作者背景不明，強烈質疑對方辯手涉嫌偽造學術數據。", "B. 該智庫的政治立場極度偏頗，因此其得出的所有結論都不可信。", "C. 該報告缺乏嚴謹的學術審查機制，其客觀性與參考價值大幅降低。", "D. 我們也準備了另一份完全相反的智庫報告，證明對方的報告是錯的。"], "a": 2, "exp": "C 精準打擊了證據的公信力。A過於具攻擊性，B容易陷入政治口水戰，D會變成各說各話的死胡同。"},
            {"q": "當我方處於反方，面對正方提出一個「雖然效益極小，但也幾乎沒有成本」的微調政策時，最佳戰略是：", "o": ["A. 誇大該微調政策可能帶來的隱藏成本，試圖將其描繪成一場大災難。", "B. 承認其無害，同時指出政策無法解決真正痛點，浪費資源。", "C. 提出一個成本巨大但效益也同樣巨大的相抗計畫來與正方進行比較。", "D. 堅持反對到底，不斷強調現狀已經非常完美，完全不需要任何微調。"], "a": 1, "exp": "B 是對付「微調型正方」的利器。承認其無害能展現風度，但打擊其「不能解決根本問題」，讓該政策失去推行的意義。"},
            {"q": "比賽中，對方主辯的發言超時長達三十秒，評判已經按鈴。此時我方第一副辯站起來，第一句話最適合說：", "o": ["A. 「對方主辯嚴重超時，可見其講稿極度冗長且缺乏時間觀念。」", "B. 「謝謝對方主辯豐富的發言，接下來讓我們回到辯題的核心焦點...」", "C. 「請評判嚴格扣除對方超時的分數，以維持本場比賽的絕對公平。」", "D. 「對方剛才超時講的內容我們一概不予承認，我將只反駁法定時間內的論點。」"], "a": 1, "exp": "B 展現了極高的辯場風度。評判自然會處理超時扣分的問題，己方不需要越俎代庖顯得咄咄逼人。"},
            {"q": "在台下發問環節，台下觀眾提出了一個極度偏激且針對你個人的刁鑽問題。你應該如何回應？", "o": ["A. 嚴詞駁斥該名觀眾的偏激言論，捍衛自己的尊嚴與本隊的立場。", "B. 拒絕回答該問題，並請主席介入處理這種不禮貌的台下發問行為。", "C. 展現風度幽默化解人身攻擊，並將問題核心巧妙牽引回己方的戰場。", "D. 順著觀眾的偏激邏輯給出一個模糊的答案，希望能趕快結束這個尷尬環節。"], "a": 2, "exp": "C 是高情商的表現。台下發問往往考驗辯手的心理素質，幽默化解不僅能贏得掌聲，還能順勢加強己方論點。"},
            {"q": "對方主張「嚴刑峻法能有效減少犯罪」，並舉出新加坡的例子。我方最佳的拆解方法是：", "o": ["A. 指出新加坡的國情、文化與法治環境與香港不同，不能直接進行簡單類比。", "B. 舉出另一個實施嚴刑峻法但犯罪率依然很高的國家，證明對方論點無效。", "C. 強調嚴刑峻法違反了現代人權精神，即使能減少犯罪也不應該被提倡。", "D. 質疑新加坡官方公佈的犯罪數據可能造假，因為獨裁國家的數據不可信。"], "a": 0, "exp": "A 切斷了對方的「類比推論」。不同國家的社會背景差異巨大，直接將他國成功經驗套用於香港往往缺乏實證支持。"},
            {"q": "辯題「香港應全面禁止燃油車」。正方主打「減少空氣污染」。反方若要打出「相抗計畫」，何者最有效？", "o": ["A. 強調燃油車是香港經濟命脈，一旦禁止會導致運輸業崩潰，後果不堪設想。", "B. 證明電動車的電池生產與回收過程，同樣會造成極為嚴重的重金屬污染。", "C. 提出「大幅提高燃油稅及排放標準」，證明無須全面禁止也能達到減排目標。", "D. 指出香港目前的充電樁基建嚴重不足，全面禁止燃油車在現階段根本不可行。"], "a": 2, "exp": "C 是一個標準的相抗計畫（Counter-plan）。證明了己方的方案能達到與正方相似的利益，但付出的社會成本更低。"},
            {"q": "當己方主辯的申論被對方第一副辯幾乎全盤摧毀時，我方第二副辯最重要的任務是：", "o": ["A. 徹底放棄主辯原本的邏輯框架，現場即興構思一套全新的論點來進行反擊。", "B. 將主辯的講稿原封不動地再唸一次，堅信只要重複夠多次評判就會買單。", "C. 挑出對方攻擊中最薄弱的一點進行反駁，試圖挽回一點顏面並拖延時間。", "D. 迅速修補主辯邏輯的斷裂處，承認小瑕疵但重建核心防線，穩定全隊軍心。"], "a": 3, "exp": "D 是團隊辯論的靈魂。副辯必須承擔起修補戰線的責任，承認非致命瑕疵反而能讓防線顯得更加堅實。"},
            {"q": "討論「應否立法規管假新聞」時，反方強烈質疑「誰來定義假新聞，政府會藉此打壓異己」。正方如何防禦？", "o": ["A. 強調政府是由市民選出來的，我們應該無條件信任政府的執法絕對公正。", "B. 指出即使有打壓異己的風險，為了社會整體的安寧與秩序，這代價是值得的。", "C. 提出交由獨立的第三方專業機構與司法體系進行裁定，設立嚴謹的制衡機制。", "D. 反擊對方過度被害妄想，現代社會資訊發達，政府根本無法輕易隻手遮天。"], "a": 2, "exp": "C 提供了實質的制度保障。面對濫權的質疑，唯有提出完善的制衡機制，才能消除評判與大眾的疑慮。"},
            {"q": "對方第二副辯在發言最後十秒突然拋出一個全新且極具煽動性的論點。我方結辯應如何應對？", "o": ["A. 花費整整兩分鐘的時間，詳細且全面地反駁這個突如其來的新論點。", "B. 簡單點出對方在副辯局末才拋出新論點有違交鋒精神，隨即回歸全場總結。", "C. 放棄原定講稿，同樣在結辯時拋出一個全新的論點來與對方互相傷害。", "D. 完全當作沒聽到，不作任何回應，以免幫對方的新論點增加討論熱度。"], "a": 1, "exp": "B 是防禦偷襲的最佳策略。點出對方違規（New argument），讓評判產生警惕，然後專注於己方最重要的總結任務。"},
            {"q": "辯題「港府應推行全民強制器官捐贈（預設默認）」。正方強調拯救生命。反方最核心的價值反撲是：", "o": ["A. 指出香港的醫療資源根本無法處理突然暴增的器官移植手術量。", "B. 質疑捐贈的器官可能會被有心人士濫用，衍生出黑市交易的問題。", "C. 堅守「身體自主權」，強調國家無權在未獲明確同意下預設處置公民遺體。", "D. 提出這會引起市民極大的恐慌與反感，導致大量不必要的社會撕裂。"], "a": 2, "exp": "C 直接從底層的道德權利進行反擊。在牽涉身體權利的辯題中，自主權通常是反方最強大的武器。"},
            {"q": "當對方使用「訴諸同情」的謬誤，不斷描述弱勢群體的慘況來迴避政策質疑時。你應如何破局？", "o": ["A. 直接指出對方的做法非常虛偽，只是在利用弱勢群體來贏得辯論比賽。", "B. 講述另一個群體因為實施該政策而受害的慘況，與對方進行比慘大賽。", "C. 肯定對方的善意，但犀利指出「善良的願望無法掩蓋政策設計的嚴重缺陷」。", "D. 順著對方的話，承認現狀確實很慘，並立刻宣佈己方同意對方的所有觀點。"], "a": 2, "exp": "C 展現了理性的光芒。不否定對方的出發點，但將討論焦點拉回政策的客觀效益與實踐可行性上。"},
            {"q": "在「價值辯論」中，雙方對於辯題的「評判標準（判準）」爭持不下。決定勝負的關鍵通常取決於：", "o": ["A. 哪一方的辯手說話語氣更加堅定、氣勢更加磅礡，能壓倒對方的氣焰。", "B. 哪一方能更清晰地向評判論證，為何己方的判準更符合當下社會的核心利益。", "C. 哪一方能夠找到更多權威字典對辯題字眼進行最古老、最冷僻的學術解釋。", "D. 哪一方能在自由辯論環節中，提出更多讓對方無法回答的刁鑽細節問題。"], "a": 1, "exp": "B 是爭奪判準的核心。判準沒有絕對的對錯，誰能證明自己的尺規更適合量度當下的社會環境，誰就能主導比賽。"},
            {"q": "辯題「科技發展令人類更加孤獨」。反方舉出「視像通話讓人隨時見面」為例。正方最佳的深層拆解是：", "o": ["A. 指出視像通話的畫質和網絡經常不穩定，根本無法取代真實的面對面交流。", "B. 強調即使有視像通話，還是有很多人懶得打電話，所以科技沒有解決問題。", "C. 點出科技只增加了「連結的頻率」，卻削弱了「情感的深度」，導致群體孤獨。", "D. 舉出現代人沈迷於手機遊戲的例子，證明科技反而讓人減少了通話的時間。"], "a": 2, "exp": "C 進行了極佳的「概念細化」。區分了「聯絡」與「情感交流」，將對方的表面反駁化解於無形。"},
            {"q": "當對方將你的政策主張無限上綱，例如「今天限制高糖飲料，明天是不是就要限制吃飯」。這屬於：", "o": ["A. 稻草人謬誤：對方捏造了一個你從未主張過的極端立場來進行攻擊。", "B. 滑坡謬誤：對方忽略了政策的合理界線，硬推導出必然走向極端的結果。", "C. 偽二分法謬誤：對方刻意製造了只有「完全自由」或「完全獨裁」兩個選項。", "D. 偷換概念謬誤：對方把「限制」這個詞語的意思替換成了「全面剝奪」。"], "a": 1, "exp": "B 是滑坡謬誤的典型特徵。面對這種攻擊，必須重申政策的「明確界線」與「止損機制」來斬斷對方的滑坡鏈條。"},
            {"q": "自由辯論中，己方隊友被對方一個極其刁鑽的數據題問得語塞。你作為下一位接力的辯手，應當：", "o": ["A. 立刻轉移話題，拋出一個毫不相干的問題來掩飾己方剛才的尷尬與失誤。", "B. 誠實地向評判承認己方確實不知道那個數據，並稱讚對方的資料準備很充足。", "C. 指出該具體數字並非核心交鋒點，用一句話總結大方向後，重新拋出主攻問題。", "D. 胡亂編造一個看起來很合理的數據來反駁對方，賭對方也無法當場查證。"], "a": 2, "exp": "C 是完美的救場技巧。化解隊友的尷尬，剝奪對方數據的關鍵性，並立刻發動反擊奪回話語權。"},
            {"q": "辯題「應否將最低工資改為生活工資」。正方主打保障基層尊嚴。反方最實用的經濟學反駁是：", "o": ["A. 基層勞工其實不需要太多的金錢，他們更需要的是社會的尊重與精神上的支持。", "B. 企業成本大幅增加會將成本轉嫁給消費者，最終推高通脹，令基層得不償失。", "C. 很多老闆也是辛辛苦苦創業的，強迫他們支付更高的工資對資方來說非常不公平。", "D. 政府可以直接派錢給基層勞工來解決貧窮問題，完全不需要透過干預自由市場。"], "a": 1, "exp": "B 點出了政策的「副作用」與「反效果」。證明正方的善良政策最終反而會傷害他們想要保護的群體。"},
            {"q": "己方第一副辯發言時，不小心提出了一個與主辯框架有輕微矛盾的論點。對方立刻大力追擊。我方應：", "o": ["A. 結辯時嚴厲批評對方斷章取義，死咬著我方的口誤不放，毫無辯論風度。", "B. 堅稱主辯和副辯的意思完全一致，是對方理解能力有問題，拒絕承認矛盾。", "C. 承認副辯舉例有瑕疵，但迅速將焦點拉回主辯的核心底線，證明大框架未受損。", "D. 直接放棄該副辯的整個論點段落，並將剩餘時間全部用來攻擊對方的缺點。"], "a": 2, "exp": "C 是誠實且聰明的做法。掩蓋矛盾只會讓對方越咬越緊，承認小瑕疵並重申大原則，能迅速結束這場無謂的糾纏。"},
            {"q": "討論「動物權益是否應與人權看齊」。對方以「動物沒有理性思考能力」為由反對。正方最強的倫理學反擊是：", "o": ["A. 指出很多動物（如海豚、猩猩）其實非常聰明，智商甚至不亞於人類的小孩。", "B. 提出「邊緣人類論」：嚴重智障人士或嬰兒也缺乏理性，但我們仍賦予其基本權利。", "C. 強調人類也是由動物進化而來的，我們不應該忘本，必須給予動物同等的尊重。", "D. 質疑理性思考並不是什麼了不起的能力，人類的貪婪與自私反而給地球帶來災難。"], "a": 1, "exp": "B 是動物權益辯論中的經典大招（邊緣案例論證）。利用對方標準的邏輯漏洞，迫使對方陷入極嚴重的道德困境。"},
            {"q": "辯題「香港應推行垃圾徵費」。反方主打「會引發大量非法棄置問題」。正方要如何防禦這項「衍生弊端」？", "o": ["A. 承認會有非法棄置，但認為這是香港市民質素低劣的問題，與政策設計無關。", "B. 指出配合閉路電視監控與加重罰則的配套措施，能將非法棄置的風險降至最低。", "C. 強調只要垃圾徵費的收費標準訂得極低，市民就不會為了省錢而去非法棄置。", "D. 提出如果真的發生非法棄置，政府可以聘請更多的清潔工人來處理這些垃圾。"], "a": 1, "exp": "B 提出了完善的「配套措施」。政策從來都不是完美的，有能力提出配套方案來修補漏洞，是正方必須具備的質素。"},
            {"q": "在「事實性辯題」中，雙方各自提出了大量互相衝突的科學研究。評判最終會如何裁決？", "o": ["A. 誰的報告頁數更多、提出的數據圖表看起來更專業，評判就會傾向相信哪一方。", "B. 評判會親自利用手機上網搜尋相關資料，以辨別哪一方提出的研究報告才是真實的。", "C. 哪一方能更清晰地解釋其研究方法的優越性，並精準指出對方研究的侷限性。", "D. 由於雙方都有數據支持，評判會直接忽略所有客觀數據，純粹根據個人的主觀感受。"], "a": 2, "exp": "C 是檢驗證據的標準。數據本身不會說話，辯手必須向評判解釋為何我方的數據來源更權威、取樣更具代表性。"},
            {"q": "對方在發言時，使用極其煽情且誇張的語氣，試圖營造「己方代表絕對正義」的氣氛。你接續發言的最佳策略是：", "o": ["A. 用比對方更加誇張、更加大聲的語氣進行反擊，在氣勢上絕對不能被對方壓倒。", "B. 保持冷靜理性的語調，用清晰的邏輯拆解對方的論證，與對方的激情形成強烈對比。", "C. 在台上公開批評對方演技拙劣，像是在演舞台劇而不是在進行嚴肅的辯論比賽。", "D. 順著對方的戲劇節奏，假裝被對方的言辭感動到落淚，然後再突然進行反轉攻擊。"], "a": 1, "exp": "B 能發揮「冷靜克制」的力量。在對方情緒高漲時，冷靜的說理往往能給評判帶來更深刻、更具說服力的反差感。"},
            {"q": "辯題「應否禁止代孕商業化」。正方主張「子宮不應成為商品」。反方最強有力的「類比反駁」是：", "o": ["A. 指出捐血和捐精也可以獲得補償，為何提供子宮孕育生命就不能獲得合理的金錢回報？", "B. 強調在資本主義社會中，任何東西只要有需求就會有供給，禁止只會導致黑市猖獗。", "C. 提出很多基層婦女迫切需要這筆金錢來改善生活，禁止代孕是斷了她們的生計。", "D. 反問正方，如果他們自己無法生育，難道不想花錢請人幫忙完成當父母的夢想嗎？"], "a": 0, "exp": "A 是非常精準的類比反駁。將對方認為不可商品化的事物，與社會已普遍接受的類似事物並列，凸顯對方的雙重標準。"},
            {"q": "當對方主動提出一個「讓步條件」（例如：我們同意在極端情況下可以豁免），我方應如何利用這個讓步？", "o": ["A. 堅定拒絕接受對方的任何讓步，強調這只是對方的緩兵之計，必須全面否定對方。", "B. 大肆嘲笑對方立場不堅定、自相矛盾，並要求評判立刻判定對方輸掉這場比賽。", "C. 收下讓步，並順勢推導：既然對方承認在極端情況需豁免，代表其核心原則存在根本性缺陷。", "D. 為了展現我方的風度與大方，我們也主動提出一個相對應的讓步條件來與對方交換。"], "a": 2, "exp": "C 是順水推舟的絕佳運用。將對方的善意讓步轉化為攻擊對方核心邏輯不夠堅實的武器。"},
            {"q": "辯題「AI 發展對人類就業是威脅」。正方列出大量將被取代的職業清單。反方如何破局？", "o": ["A. 逐一反駁清單上的職業，硬拗這些工作都需要人類的情感，AI 絕對無法完全取代。", "B. 指出歷史上每一次工業革命都會消滅舊職業，但同時創造更多高價值的新職業，AI 亦然。", "C. 強調即使人們失業，政府也會推行全民基本收入（UBI）來保障大家的生活，所以不用擔心。", "D. 批評正方是在散佈科技恐慌，阻礙人類社會的進步，這種思想是非常落後且保守的。"], "a": 1, "exp": "B 提供了宏觀的歷史視角。不否認短期的陣痛，但用長期的歷史規律來證明整體機遇大於威脅，極具說服力。"},
            {"q": "對方在申論時，刻意使用了大量艱澀難懂的專業學術詞彙（Jargon），導致全場一頭霧水。你反擊時應該：", "o": ["A. 為了展現自己的學識淵博，使用比對方更生僻、更艱澀的外語詞彙來進行回應。", "B. 向評判抱怨對方的發言違反了辯論比賽應該深入淺出的原則，要求不予計分。", "C. 用極其通俗易懂的生活化語言，一句話翻譯並戳破對方故弄玄虛背後的薄弱邏輯。", "D. 承認自己聽不懂對方的專業理論，但堅持己方常識性的論點依然是正確無誤的。"], "a": 2, "exp": "C 是展現自信與實力的最佳方式。能把複雜的理論用人話講清楚，不僅能贏得觀眾好感，更能凸顯對方的外強中乾。"},
            {"q": "討論「應否取消學校考試制度」。正方主張「考試扼殺創意」。反方最有力的「必要之惡」防禦是：", "o": ["A. 雖然考試有壓力，但它是目前社會上最客觀、最公平且成本最低的資源分配與能力檢定機制。", "B. 創意並不能當飯吃，學生未來進入職場還是需要紮實的硬知識，所以考試絕對不能取消。", "C. 很多沒有考試壓力的外國學生，他們的數學能力和紀律普遍都比嚴格考試的香港學生差很多。", "D. 如果取消考試，老師就沒有辦法強迫學生溫習功課，整個香港的教育體系就會立刻徹底崩潰。"], "a": 0, "exp": "A 承認了制度的缺陷（有壓力），但強調了其不可替代的核心價值（客觀公平），這也是現實社會運行的底層邏輯。"},
            {"q": "在比賽的最後十秒鐘，作為結辯的你發現還有一個次要論點沒講完，但時間已經不夠。你應該：", "o": ["A. 大幅加快語速，像唸急口令一樣強行把剩下的講稿全部塞完，能講多少是多少。", "B. 直接放棄次要論點，用最從容自信的語氣，精煉出一句能震撼人心的核心價值金句作為收尾。", "C. 無視計時員的鈴聲，不疾不徐地繼續講完自己準備好的所有內容，展現無畏的大將之風。", "D. 突然停頓下來，向評判和觀眾鞠躬道歉，表示自己準備不周時間控制失當，感到非常抱歉。"], "a": 1, "exp": "B 是結辯的最高境界。結語的氣勢與餘韻遠比一個次要論點來得重要，從容收尾能給評判留下極佳的最後印象。"}
        ];

        let questions = [];
        let currentIndex = 0;
        let isAnswering = false;

        let boatDistance = 5; 
        let consecutiveWrongs = 0; 
        let gameStatus = "playing"; 

        let dashCooldown = 0; 
        let dashActive = false;
        let dashSecondChance = false;
        
        let phase2Unlocked = false;
        let phase2Active = false;
        
        let phase3Unlocked = false;
        let phase3Active = false;

        // 【防呆機制】：強制檢查並修復損壞的 LocalStorage 資料
        function initGame() {
            const savedData = localStorage.getItem('debateQuizData');
            if (savedData) {
                try { 
                    const parsed = JSON.parse(savedData);
                    if (!Array.isArray(parsed) || parsed.length === 0 || typeof parsed[0].q === 'undefined' || !Array.isArray(parsed[0].o)) {
                        throw new Error("Data corrupted");
                    }
                    questions = parsed;
                } catch (e) { 
                    localStorage.removeItem('debateQuizData');
                    questions = JSON.parse(JSON.stringify(defaultQuestions)); 
                }
            } else {
                questions = JSON.parse(JSON.stringify(defaultQuestions));
            }
            startGame();
        }

        function startGame() {
            if (!questions || questions.length === 0) return; 
            
            currentIndex = 0;
            boatDistance = 5;
            consecutiveWrongs = 0;
            dashCooldown = 0;
            gameStatus = "playing";
            
            dashActive = false;
            dashSecondChance = false;
            phase2Unlocked = false;
            phase2Active = false;
            phase3Unlocked = false;
            phase3Active = false;
            
            document.getElementById('game-container').classList.remove('deep-sea', 'death-zone');
            document.getElementById('action-msg').innerText = "提示：保持選項長度一致，專注分析底層邏輯。";

            updateUI();
            loadQuestion();
        }

        function updateUI() {
            document.getElementById('q-counter').innerText = `第 ${currentIndex + 1} 題 / 共 ${questions.length} 題`;
            document.getElementById('distance-text').innerText = `距離被吃掉: ${boatDistance} 格`;
            document.getElementById('wrong-text').innerText = `連續錯誤: ${consecutiveWrongs} / 5`;

            let safeDist = Math.max(0, boatDistance - 1);
            let waterAhead = Math.max(0, 15 - safeDist);
            document.getElementById('track-container').innerText = `🦈` + `🌊`.repeat(safeDist) + `⛵` + `〰️`.repeat(waterAhead);

            // 判斷是否進入死神海域 (最後10題) 或 深海區 (第10題後)
            let isDeathZone = (currentIndex >= questions.length - 10);
            let isDeepSea = (currentIndex >= 10);

            const btnPhase2 = document.getElementById('btn-phase2');

            if (isDeathZone && gameStatus === "playing") {
                phase3Unlocked = true;
                phase3Active = true;
                
                document.getElementById('game-container').classList.add('death-zone');
                document.getElementById('game-container').classList.remove('deep-sea');
                
                btnPhase2.disabled = false;
                btnPhase2.classList.add('danger');
                btnPhase2.innerText = "💀 死神海域：答錯鯊魚瞬間貼背！";
                
                document.getElementById('action-msg').innerText = "🚨 極度危險：進入最後10題！任何失誤將導致鯊魚瞬間閃現追上！";
                document.getElementById('action-msg').style.color = "#ff1744";

            } else if (isDeepSea && !phase3Active && gameStatus === "playing") {
                phase2Unlocked = true;
                phase2Active = true; 
                
                document.getElementById('game-container').classList.add('deep-sea');
                document.getElementById('game-container').classList.remove('death-zone');
                
                btnPhase2.disabled = false;
                btnPhase2.classList.add('danger');
                btnPhase2.innerText = "⚠️ 進入深海區：錯退2格，對進1格！";
                
                document.getElementById('action-msg').innerText = "🚨 警告：進入深海區！容錯率大幅降低！猛衝失敗將面臨恐怖的 4 格懲罰！";
                document.getElementById('action-msg').style.color = "#ff4d4d";
            }

            // 更新按鈕狀態 (進入深海或死神海域後，猛衝按鈕維持可用，因為你要求深海區開放)
            // 修正：你說過猛衝在深海區開放且CD變3題，但後面又說「到了深海區便停用功能」，我這裡照你最新的指示「我想在『深海區』開放並且CD時間減至三題可使用一次...退四格」。
            const btnDash = document.getElementById('btn-dash');
            if (dashCooldown > 0) {
                btnDash.disabled = true;
                btnDash.innerText = `🩸 猛衝 (冷卻中: ${dashCooldown} 題)`;
                btnDash.classList.remove('active');
            } else if (!dashActive) {
                btnDash.disabled = false;
                btnDash.innerText = "🩸 鯊魚手段：猛衝 (主動)";
            }
        }

        function toggleDash() {
            if (isAnswering || dashCooldown > 0) return;
            dashActive = !dashActive;
            const btn = document.getElementById('btn-dash');
            btn.classList.toggle('active', dashActive);
            
            let msg = document.getElementById('action-msg');
            if (dashActive) {
                // 如果在深海/死神區，懲罰是 4 格
                let penalty = (phase2Active || phase3Active) ? 4 : 2;
                msg.innerText = `🩸 鯊魚蓄力猛衝！(若答錯可重答，再錯退 ${penalty} 格。使用後冷卻 3 題)`;
                msg.style.color = "#ffcc00";
            } else {
                msg.innerText = "";
                updateUI(); // 回復原本的警告語句
            }
        }

        function loadQuestion() {
            isAnswering = false;
            dashSecondChance = false;
            const qData = questions[currentIndex];
            
            if (!qData) return; 
            
            document.getElementById('question-box').innerText = qData.q;
            
            for (let i = 0; i < 4; i++) {
                const btn = document.getElementById(`opt-${i}`);
                if (qData.o && qData.o[i]) {
                    btn.innerText = qData.o[i];
                } else {
                    btn.innerText = "載入失敗";
                }
                btn.className = 'option-btn'; 
                btn.disabled = false;
            }
            updateUI();
        }

        function checkAnswer(selectedIndex) {
            if (isAnswering && !dashSecondChance) return; 
            
            const qData = questions[currentIndex];
            const correctIndex = qData.a;
            const selectedBtn = document.getElementById(`opt-${selectedIndex}`);
            
            let isCorrect = (selectedIndex === correctIndex);

            // 處理猛衝第一階段 (第一次答錯)
            if (dashActive && !isCorrect && !dashSecondChance) {
                dashSecondChance = true; 
                selectedBtn.classList.add('wrong');
                selectedBtn.disabled = true; 
                
                let penalty = (phase2Active || phase3Active) ? 4 : 2;
                let msg = document.getElementById('action-msg');
                msg.innerText = `💥 鯊魚猛衝落空！你還有一次機會，再錯將狂退 ${penalty} 格！`;
                msg.style.color = "#ff4d4d";
                return; 
            }

            // 正式結算
            isAnswering = true; 
            const correctBtn = document.getElementById(`opt-${correctIndex}`);

            for (let i = 0; i < 4; i++) {
                document.getElementById(`opt-${i}`).disabled = true;
            }

            let movementText = "";
            let forwardStep = 1;
            let backwardStep = (phase2Active || phase3Active) ? 2 : 1; 

            // 如果猛衝失敗，強加懲罰
            if (dashSecondChance && !isCorrect) {
                backwardStep = (phase2Active || phase3Active) ? 4 : 2; 
            }

            if (dashActive || dashSecondChance) {
                dashCooldown = 4; // 下一題開始時會扣1，變成CD 3題
                dashActive = false;
                dashSecondChance = false;
            }

            if (isCorrect) {
                selectedBtn.classList.add('correct');
                boatDistance += forwardStep;
                consecutiveWrongs = 0; 
                movementText = `⛵ 漂亮！邏輯正確，小船向前行 ${forwardStep} 格！`;
            } else {
                selectedBtn.classList.add('wrong');
                if(correctBtn) correctBtn.classList.add('correct');
                
                // 死神海域特殊結算機制
                boatDistance -= backwardStep; // 先扣除基本懲罰
                
                if (phase3Active && boatDistance > 1) {
                    boatDistance = 1; // 強制拉近到身後 1 格
                    movementText = `💀 致命失誤！鯊魚聞到血腥味，瞬間閃現到船尾！下一題錯即死！`;
                } else if (phase3Active) {
                    movementText = `🩸 邏輯崩塌！小船被深淵巨鯊無情吞噬！`;
                } else {
                    movementText = `⚠️ 邏輯陷阱！退後 ${backwardStep} 格！鯊魚逼近！`;
                }
                
                consecutiveWrongs++; 
            }

            updateUI();

            if (boatDistance <= 0) {
                gameStatus = "lose_eaten";
            } else if (consecutiveWrongs >= 5) {
                gameStatus = "lose_mistakes";
            } else if (currentIndex === questions.length - 1 && isCorrect) {
                gameStatus = "win";
            }

            setTimeout(() => {
                showExplanation(isCorrect, movementText, qData.exp);
            }, 1200);
        }

        function showExplanation(isCorrect, moveText, explanation) {
            const modal = document.getElementById('explanation-modal');
            const title = document.getElementById('exp-result');
            const moveDiv = document.getElementById('exp-movement');
            const text = document.getElementById('exp-text');
            const nextBtn = document.getElementById('exp-next-btn');

            moveDiv.innerText = moveText;

            if (gameStatus === "playing") {
                title.innerText = isCorrect ? "✅ 拆解成功" : "❌ 墜入陷阱";
                title.style.color = isCorrect ? "#00c853" : "#ff1744";
                nextBtn.innerText = "繼續航行";
            } else {
                title.innerText = "🚨 遊戲結束";
                title.style.color = "#ff4d4d";
                nextBtn.innerText = "查看結果";
            }
            
            text.innerText = explanation ? `【戰術覆盤】\n${explanation}` : "此題未提供題解。";
            modal.style.display = 'flex';
        }

        function handleNextStep() {
            document.getElementById('explanation-modal').style.display = 'none';
            document.getElementById('action-msg').innerText = "";
            
            if (gameStatus === "playing") {
                if (dashCooldown > 0) dashCooldown--;
                currentIndex++;
                loadQuestion();
            } else {
                showFinalResult();
            }
        }

        function showFinalResult() {
            const modal = document.getElementById('explanation-modal');
            const title = document.getElementById('exp-result');
            const moveDiv = document.getElementById('exp-movement');
            const text = document.getElementById('exp-text');
            const nextBtn = document.getElementById('exp-next-btn');

            moveDiv.innerText = "";

            if (gameStatus === "win") {
                title.innerText = "🏆 稱霸深海！";
                title.style.color = "#ffcc00";
                text.innerText = `太強了！你成功拆解了所有實戰陷阱，順利擺脫了鯊魚！\n\n最終安全距離：${boatDistance} 格\n你已經具備高階辯手的邏輯素質！`;
            } else if (gameStatus === "lose_eaten") {
                title.innerText = "☠️ 葬身魚腹";
                title.style.color = "#ff1744";
                text.innerText = `距離歸零，小船被鯊魚無情吞噬！\n你在第 ${currentIndex + 1} 題被邏輯陷阱困住。\n不要氣餒，釐清戰術覆盤後重新出發！`;
            } else if (gameStatus === "lose_mistakes") {
                title.innerText = "💥 船體崩潰";
                title.style.color = "#ff1744";
                text.innerText = `連續答錯 5 題，船體承受不住深海水壓沉沒了！\n你在第 ${currentIndex + 1} 題止步。\n請仔細檢討每一次的戰術覆盤！`;
            }

            nextBtn.innerText = "重新挑戰";
            nextBtn.onclick = () => {
                modal.style.display = 'none';
                startGame();
                nextBtn.onclick = handleNextStep; 
            };
            modal.style.display = 'flex';
        }

        function openEditor() { document.getElementById('editor-modal').style.display = 'flex'; }
        function closeEditor() { document.getElementById('editor-modal').style.display = 'none'; }
        
        function saveEditor() {
            try {
                const newJson = document.getElementById('json-editor').value;
                const parsed = JSON.parse(newJson);
                if (!Array.isArray(parsed) || parsed.length === 0 || typeof parsed[0].q === 'undefined') throw new Error("資料格式錯誤");
                localStorage.setItem('debateQuizData', JSON.stringify(parsed));
                questions = parsed;
                alert("儲存成功！系統將重新載入遊戲。");
                closeEditor();
                startGame();
            } catch (e) {
                alert("JSON 格式有誤！請檢查括號或引號。\n錯誤訊息: " + e.message);
            }
        }

        function resetDefault() {
            if(confirm("確定要刪除你修改的題目，恢復預設嗎？")) {
                localStorage.removeItem('debateQuizData');
                document.getElementById('json-editor').value = JSON.stringify(defaultQuestions, null, 4);
                questions = JSON.parse(JSON.stringify(defaultQuestions));
                closeEditor();
                startGame();
            }
        }

        window.onload = initGame;
    </script>
</body>
</html>
